name: WASM Build

on:
  push:
    paths: ['rtl/**', 'wasm/**', '.github/workflows/wasm.yml']
  pull_request:
    paths: ['rtl/**', 'wasm/**', '.github/workflows/wasm.yml']

jobs:
  wasm-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The harness uses Verilator 5 APIs (VerilatedContext); build from source like rtl.yml.
      - name: Cache Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-v5.036-ubuntu-24.04

      - name: Build Verilator v5.036 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf flex bison libfl2 libfl-dev help2man perl build-essential
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator-install"
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "$HOME/verilator-install/bin" >> $GITHUB_PATH

      # Pinned to the version the committed engine was built with: the compiled .wasm changes between Emscripten
      # releases, and the freshness check below compares bytes.
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build spike WASM
        run: bash wasm/spike/build.sh

      - name: Run spike headless (two independent instances)
        run: node wasm/spike/test.mjs

      - name: Report artifact size
        run: |
          test -f web/public/spike/counter.wasm
          echo "spike wasm: $(du -h web/public/spike/counter.wasm | cut -f1)"

      # The engine: Verilate tiny_attn_top, build the module, run the golden fixtures in Node, check the size budget.
      - name: Build engine WASM
        run: bash wasm/build.sh

      # The committed engine (web/public, served by the site) must be the build of the RTL in this commit.
      # Fails if a fresh build differs from the committed files: rebuild with `bash wasm/build.sh` and commit.
      - name: Committed engine matches a fresh build
        run: git diff --exit-code -- web/public/tiny_attn.mjs web/public/tiny_attn.wasm

      - name: Engine golden fixtures (Node)
        run: node wasm/test.mjs

      - name: Size budget (500 KB gzipped)
        run: |
          GZ=$(gzip -9 -c web/public/tiny_attn.wasm | wc -c)
          echo "engine wasm gzip: $GZ bytes"
          test "$GZ" -le 512000
