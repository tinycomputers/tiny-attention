name: RTL CI

on:
  push:
    paths: ['rtl/**', 'sim/**', '.github/workflows/rtl.yml']
  pull_request:
    paths: ['rtl/**', 'sim/**', '.github/workflows/rtl.yml']

jobs:
  rtl-ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # cocotb 2.x needs Verilator >= 5.036; the ubuntu-24.04 apt package is older,
      # so build from source and cache by version tag.
      - name: Cache Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-v5.036-ubuntu-24.04

      - name: Build Verilator v5.036 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf flex bison libfl2 libfl-dev help2man perl
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator-install"
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "$HOME/verilator-install/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r sim/requirements.txt

      - name: Lint RTL
        run: verilator --lint-only -Wall --top-module counter rtl/spike/counter.sv

      # Each suite gets its own SIM_BUILD: cocotb does not detect a TOPLEVEL change
      # across runs sharing one sim_build/ and reuses the stale binary.
      - name: cocotb - counter spike
        working-directory: sim
        run: make MODULE=test_counter TOPLEVEL=counter WAVES=0 SIM_BUILD=sim_build/counter
