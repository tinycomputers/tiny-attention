name: RTL CI

on:
  push:
    paths: ['rtl/**', 'sim/**', '.github/workflows/rtl.yml']
  pull_request:
    paths: ['rtl/**', 'sim/**', '.github/workflows/rtl.yml']

jobs:
  rtl-ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # cocotb 2.x needs Verilator >= 5.036; the ubuntu-24.04 apt package is older,
      # so build from source and cache by version tag.
      - name: Cache Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-v5.036-ubuntu-24.04

      - name: Build Verilator v5.036 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf flex bison libfl2 libfl-dev help2man perl
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator-install"
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "$HOME/verilator-install/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r sim/requirements.txt

      # Golden models: exp2/recip, both schedules, accuracy bounds, traffic, presets, and the check that
      # rtl/lut_pkg.sv matches gen_luts.py. Full 1000-seed sweep (about 20 s).
      - name: Golden model tests
        run: python -m pytest sim/golden -q
        env:
          SEEDS: '1000'

      - name: Lint RTL (-Wall, every module, plus the MM2 parameter set)
        run: |
          verilator --lint-only -Wall --top-module counter rtl/spike/counter.sv
          bash sim/lint.sh

      # One SIM_BUILD per suite and parameter set; exp2/recip are exhaustive. About 3 minutes.
      - name: cocotb unit suites
        run: bash sim/run_unit.sh

      # Full engine: 200 seeds x N x causal, bit-exact O, HBM bytes, tiles, K/V loads and the cycle model.
      - name: cocotb end-to-end (200 seeds)
        run: bash sim/run_e2e.sh
        env:
          SEEDS: '200'

      # Each suite gets its own SIM_BUILD: cocotb does not detect a TOPLEVEL change
      # across runs sharing one sim_build/ and reuses the stale binary.
      - name: cocotb - counter spike
        working-directory: sim
        run: make MODULE=test_counter TOPLEVEL=counter WAVES=0 SIM_BUILD=sim_build/counter
